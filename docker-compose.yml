services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: s3cret
      MYSQL_DATABASE: skip-locked-vs-redis
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.10
    command: [ "redis-server", "--requirepass", "s3cret" ]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "s3cret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  skip-locked-vs-redis:
    build:
      context: ./
      dockerfile: Dockerfile
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy